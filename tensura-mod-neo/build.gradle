plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.171'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
        client()
        if (project.hasProperty('vfxValidation')) {
            systemProperty 'tensura.vfxValidation', 'true'
            arguments.add '--quickPlaySingleplayer'
            arguments.add 'VfxValidation'
        }
    }
    server {
        server()
        arguments.add '--nogui'
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir { dirs 'libs' }
    mavenCentral()
    maven { url = 'https://maven.firstdark.dev/snapshots' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Cobblemon NeoForge — PokemonEntity, CobblemonEvents, etc.
    implementation files('libs/cobblemon.jar')

    // Kotlin for NeoForge — required for Cobblemon Kotlin interop
    implementation files('libs/kotlinforforge.jar')
    implementation files('libs/kfflang-neoforge-userdev.jar')
    implementation files('libs/kfflib-neoforge.jar')
    implementation files('libs/kffmod-neoforge.jar')

    // Kotlin stdlib — needed for compiling against Cobblemon's Kotlin API
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.0.0"

    // MineColonies — for EntityCitizen type reference in rendering/commands
    implementation files('libs/minecolonies.jar')
    runtimeOnly files('libs/blockui.jar')
    runtimeOnly files('libs/domum-ornamentum.jar')
    runtimeOnly files('libs/structurize.jar')

    // Photon 2 — GPU-instanced particles, trails, beams, meshes, and timelines
    implementation "com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all"
    implementation files('libs/photon.jar')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            photon_version_range   : photon_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version            : mod_version, mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Auto-increment patch version in gradle.properties after every successful build
tasks.named('build').configure {
    doLast {
        def propsFile = file('gradle.properties')
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        def current = props.getProperty('mod_version', '1.0.0')
        def parts = current.tokenize('.')
        parts[2] = (parts[2].toInteger() + 1).toString()
        def next = parts.join('.')
        def content = propsFile.text.replaceFirst(/mod_version=\S+/, "mod_version=${next}")
        propsFile.text = content
        println "Version bumped: ${current} → ${next}"
    }
}
